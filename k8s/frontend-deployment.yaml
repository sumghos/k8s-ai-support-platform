apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: k8s-ai-platform

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: k8s-ai-frontend:dev

          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:

            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"